<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do list</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>To-do list</h1>
      <form id="task-form">
        <label for="task-input">New task</label>
        <input id="task-input" name="task" required maxlength="300" autocomplete="off">
        <button type="submit">Add task</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="storage-warning" role="alert" hidden></p>
      <p id="empty-state">No tasks yet. Add your first task above.</p>
      <ul id="task-list" aria-label="Tasks"></ul>
      <noscript>Please enable JavaScript to use this app.</noscript>
    </main>
  </body>
</html>
